name: BioGravity Strict SEO Growth & Traffic Accelerator

on:
  schedule:
    # Runs 100% automatically in the cloud twice daily (03:00 UTC and 15:00 UTC)
    - cron: '0 3,15 * * *'
  workflow_dispatch:
    inputs:
      force_optimize:
        description: 'Force immediate site-wide growth engine cycle & rebuild'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  strict-growth-engine:
    name: Autonomous Strict Growth & Ranking Engine
    runs-on: ubuntu-latest

    steps:
      - name: 🛰️ Checkout BioGravity Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          npm ci || npm install

      - name: ⚡ Execute Strict Autonomous Growth Engine (Target: 1k imp / 50 clicks)
        env:
          GSC_KEY_JSON: ${{ secrets.GSC_KEY_JSON }}
          SITE_URL: 'https://biogravity.space'
        run: |
          echo "Executing strict cloud growth engine and indexing cycle..."
          node scripts/strict_growth_engine.js

      - name: 🚀 Commit and Push Ranking Enhancements, Rebuilt Pages & Reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage modified databases, HTML pages, sitemaps, RSS, and reports
          git add data/ articles/ sitemap.xml sitemap-news.xml index.html research/ research.html feed.xml rss.xml robots.txt llms.txt llms-full.txt SEO-RANKING-REPORT.md TOP-5-BREAKTHROUGH-REPORT.md GEO-ANALYSIS.md GROWTH-TARGET-REPORT.md package.json scripts/ outreach/

          if git diff --staged --quiet; then
            echo "✅ No new ranking changes detected. Repository is already fully optimized."
          else
            git commit -m "feat(growth-engine): strict growth acceleration, viral clusters & 1k target sync [skip ci]"
            git pull --rebase origin main || true
            git push origin main
            echo "🎉 Successfully pushed strict growth optimizations to biogravity.space!"
          fi
