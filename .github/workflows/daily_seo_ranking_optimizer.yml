name: BioGravity Daily SEO Ranking & Performance Optimizer

on:
  schedule:
    # Runs 100% automatically in the cloud every day at 09:00 UTC (peak search indexing window)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      force_optimize:
        description: 'Force immediate site-wide ranking optimization & rebuild'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  seo-ranking-optimizer:
    name: Autonomous SEO Performance & Ranking Engine
    runs-on: ubuntu-latest

    steps:
      - name: 🛰️ Checkout BioGravity Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          npm ci || npm install

      - name: ⚡ Execute Autonomous SEO Ranking Optimizer, Top 5 Booster & GEO
        env:
          GSC_KEY_JSON: ${{ secrets.GSC_KEY_JSON }}
          SITE_URL: 'https://biogravity.space'
        run: |
          echo "Executing daily cloud SEO ranking optimization, Top 5 booster and GEO cycle..."
          node scripts/top5_ranking_booster.js
          node scripts/ai_search_optimizer.js
          node scripts/daily_seo_optimizer.js

      - name: 🚀 Commit and Push Ranking Enhancements, Rebuilt Pages & Reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage modified databases, HTML pages, sitemaps, RSS, and reports
          git add data/ articles/ sitemap.xml index.html research/ research.html feed.xml rss.xml robots.txt llms.txt llms-full.txt SEO-RANKING-REPORT.md TOP-5-BREAKTHROUGH-REPORT.md GEO-ANALYSIS.md package.json scripts/

          if git diff --staged --quiet; then
            echo "✅ No new ranking changes detected. Repository is already fully optimized."
          else
            git commit -m "feat(seo-optimizer): autonomous daily SEO ranking enhancement & PageRank sync [skip ci]"
            git pull --rebase origin main || true
            git push origin main
            echo "🎉 Successfully pushed SEO ranking optimizations to biogravity.space!"
          fi
