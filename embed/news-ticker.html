<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BioGravity Live Science Wire Widget</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .marquee-container { overflow: hidden; white-space: nowrap; }
  </style>
  <link rel="stylesheet" href="/css/styles.css?v=2.1">
</head>
<body class="bg-slate-900 text-white p-3 m-0 rounded-xl overflow-hidden border border-slate-800 text-xs">
  <div class="flex items-center justify-between border-b border-slate-800 pb-2 mb-2">
    <div class="flex items-center gap-2">
      <span class="inline-block w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
      <span class="font-bold tracking-wider uppercase text-[10px] text-red-400">Live Science Wire</span>
    </div>
    <a href="https://biogravity.space" target="_blank" rel="noopener" class="text-[10px] text-teal-400 hover:text-teal-300 font-medium">BioGravity.space &rarr;</a>
  </div>

  <div id="news-container" class="space-y-2">
    <div class="text-slate-400 animate-pulse">Loading live dispatches...</div>
  </div>

  <div class="mt-3 pt-2 border-t border-slate-800/80 flex items-center justify-between text-[10px] text-slate-400">
    <span>Free Widget for Science Blogs</span>
    <a href="https://biogravity.space/news" target="_blank" rel="noopener" class="text-teal-400 hover:underline">Powered by BioGravity</a>
  </div>

  <script>
    fetch('https://biogravity.space/data/news.json')
      .then(res => res.json())
      .then(news => {
        const container = document.getElementById('news-container');
        if (!news || news.length === 0) {
          container.innerHTML = '<div class="text-slate-400">Dispatches incoming...</div>';
          return;
        }
        container.innerHTML = news.slice(0, 3).map(item => `
          <a href="https://biogravity.space/news/${encodeURIComponent(item.id)}" target="_blank" rel="noopener" class="block p-2 rounded-lg bg-slate-800/60 hover:bg-slate-800 transition border border-slate-700/50 group">
            <div class="text-[9px] font-mono text-teal-400 uppercase tracking-wide mb-0.5">${item.category || 'Science'}</div>
            <div class="font-medium text-slate-200 group-hover:text-white line-clamp-1 leading-tight text-[11px]">${item.title}</div>
          </a>
        `).join('');
      })
      .catch(() => {
        const container = document.getElementById('news-container');
        container.innerHTML = `
          <a href="https://biogravity.space/news" target="_blank" rel="noopener" class="block p-2 rounded-lg bg-slate-800 hover:bg-slate-700 transition">
            <div class="font-medium text-white text-[11px]">Explore 24/7 Live Space & Molecular Science Wire &rarr;</div>
          </a>
        `;
      });
  </script>
</body>
</html>
